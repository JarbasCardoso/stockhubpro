<!-- HEADER -->
<div class="d-flex justify-content-between align-items-center p-3 border-bottom">
  <span class="text-primary fw-bold fs-5">StockHub Pro</span>
  <span class="fw-bold">CADASTRO DE ITEM</span>
  <button type="button" class="btn btn-outline-secondary btn-sm" (click)="voltar()">
    Voltar para o início
  </button>
</div>

<!-- ALERTA DE SUCESSO -->
@if (sucesso) {
  <div class="alert alert-success mx-4 mt-3">
    Item cadastrado com sucesso!
  </div>
}

<!-- CARD FORMULÁRIO -->
<div class="container mt-4">
  <div class="card p-4" style="border-color: #4a90d9;">

    <div class="mb-3 row align-items-center">
      <label class="col-sm-4 col-form-label">Nome do produto:</label>
      <div class="col-sm-8">
        <input type="text" class="form-control" [(ngModel)]="nome" />
      </div>
    </div>

    <div class="mb-3 row align-items-center">
      <label class="col-sm-4 col-form-label">Código do produto:</label>
      <div class="col-sm-8">
        <input type="text" class="form-control" [(ngModel)]="codigo" />
      </div>
    </div>

    <div class="mb-3 row align-items-center">
      <label class="col-sm-4 col-form-label">Preço (R$):</label>
      <div class="col-sm-8">
        <input type="number" class="form-control" [(ngModel)]="preco" />
      </div>
    </div>

    <div class="mb-3 row align-items-center">
      <label class="col-sm-4 col-form-label">Quantidade Mínima:</label>
      <div class="col-sm-8">
        <input type="number" class="form-control" [(ngModel)]="qtdMinima" />
      </div>
    </div>

    <!-- BOTÕES -->
    <div class="d-flex justify-content-center gap-3 mt-3">
      <button type="button" class="btn btn-danger px-4" (click)="apagar()">
        APAGAR
      </button>
      <button type="button" class="btn btn-info px-4 text-white" (click)="cadastrar()">
        CADASTRAR
      </button>
    </div>

  </div>
</div>

<!-- FOOTER -->
<app-footer />
