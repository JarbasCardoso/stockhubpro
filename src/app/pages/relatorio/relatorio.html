<div class="d-flex flex-column min-vh-100 bg-light">
  <div class="flex-grow-1 p-4">
    <h4 class="text-center mb-4">Relatório Mensal de Estoque</h4>

    <table class="table table-bordered table-striped">
      <thead style="background-color: #4a90d9; color: white;">
        <tr>
          <th>Código</th>
          <th>Nome</th>
          <th>Entradas</th>
          <th>Saídas</th>
          <th>Saldo</th>
        </tr>
      </thead>
      <tbody>
        @for (item of itens; track item.codigo) {
          <tr>
            <td>{{ item.codigo }}</td>
            <td>{{ item.nome }}</td>
            <td>{{ item.entradas }}</td>
            <td>{{ item.saidas }}</td>
            <td>{{ item.saldo }}</td>
          </tr>
        }
      </tbody>
    </table>

    <div class="text-center mt-3">
      <button type="button" class="btn btn-secondary" (click)="voltar()">Voltar</button>
    </div>
  </div>
  <app-footer />
</div>
