<div class="d-flex flex-column min-vh-100 bg-light">
  <div class="flex-grow-1 p-4">
    <h4 class="text-center mb-4">Relatório Mensal de Estoque</h4>

    <table class="table table-bordered table-striped bg-white shadow-sm">
      <thead class="table-primary">
        <tr>
          <th>Código</th>
          <th>Nome</th>
          <th>Quantidade Atual</th>
          <th>Preço</th>
          <th>Data de Validade</th>
        </tr>
      </thead>
      <tbody>
        @for (item of (itens$ | async); track item.produtoId) {
          <tr>
            <td>{{ item.produtoCodigo }}</td>
            <td>{{ item.produtoNome }}</td>
            <td>{{ item.produtoQuantidade }}</td>
            <td>R$ {{ item.produtoPreco | number:'1.2-2' }}</td>
            <td>{{ item.produtoDataValidade }}</td>
          </tr>
        }
      </tbody>
    </table>

    <div class="text-center mt-3">
      <button type="button" class="btn btn-secondary px-4" (click)="voltar()">Voltar</button>
    </div>
  </div>
  <app-footer />
</div>
