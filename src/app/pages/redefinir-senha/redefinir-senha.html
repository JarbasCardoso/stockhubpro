<div class="d-flex flex-column min-vh-100 bg-light">

  @if (mostrarSucesso) {
  <div class="alert alert-success d-flex align-items-center position-fixed top-0 end-0 m-3" style="z-index:9999; min-width:300px;">
    <span class="me-2"></span>
    <strong>Senha redefinida com sucesso!</strong>
    <button class="btn-close ms-auto" (click)="fecharSucesso()"></button>
  </div>
  }

  <div class="flex-grow-1 d-flex align-items-center justify-content-center">
    <div class="card p-4 shadow" style="width:100%; max-width:450px; border:2px solid #4a90d9;">

      <div class="d-flex justify-content-between align-items-center mb-2">
        <h4 class="mb-0">Redefinir sua senha</h4>
        <button class="btn-close" (click)="cancelar()"></button>
      </div>

      <p class="text-muted mb-4">Preencha os campos abaixo</p>

      <div class="mb-3">
        <label class="form-label">Senha</label>
        <div class="input-group">
          <input [type]="mostrarSenha ? 'text' : 'password'" class="form-control" [(ngModel)]="senha">
          <button class="btn btn-outline-secondary" (click)="toggleSenha()"></button>
        </div>
        <small class="text-muted">(Deve conter 8 caracteres, com pelo menos uma letra maiúscula)</small>
      </div>

      <div class="mb-4">
        <label class="form-label">Confirme sua senha</label>
        <div class="input-group">
          <input [type]="mostrarConfirmar ? 'text' : 'password'" class="form-control" [(ngModel)]="confirmarSenha">
          <button class="btn btn-outline-secondary" (click)="toggleConfirmar()"></button>
        </div>
      </div>

      <button class="btn btn-primary w-100 mb-3" (click)="redefinir()">REDEFINIR</button>

      <div class="d-flex justify-content-between">
        <a href="#" class="text-danger" (click)="$event.preventDefault(); cancelar()">Cancelar</a>
        <a href="#" (click)="$event.preventDefault(); cancelar()">Fazer login</a>
      </div>
    </div>
  </div>

  <app-footer />
</div>
