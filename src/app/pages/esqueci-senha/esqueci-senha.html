<div class="d-flex flex-column min-vh-100 bg-light">

  <div class="flex-grow-1 d-flex align-items-center justify-content-center">
    <div class="card p-4 shadow" style="width:100%; max-width:450px; border:2px solid #4a90d9;">
      
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0">Esqueci minha senha</h4>
        <button class="btn-close" (click)="cancelar()"></button>
      </div>

      <div class="mb-4">
        <label class="form-label">Informe seu CPF cadastrado:</label>
        <input type="text" class="form-control" placeholder="Digite apenas os números, sem pontos nem traço" [(ngModel)]="cpf" maxlength="11">
      </div>

      <button class="btn btn-primary w-100 mb-3" style="border-radius:25px;" (click)="prosseguir()">PROSSEGUIR</button>

      <div class="text-center">
        <a href="#" class="text-danger" (click)="$event.preventDefault(); cancelar()">Cancelar</a>
      </div>
    </div>
  </div>

  <app-footer />
</div>
